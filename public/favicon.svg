<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Solar Yellow Gradient -->
    <linearGradient id="abeySolarGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="45%" stop-color="#FFD21F" />
      <stop offset="100%" stop-color="#FF9800" />
    </linearGradient>

    <!-- Brand White Gradient -->
    <linearGradient id="abeyBrandWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Dark Tile Obsidian Gradient -->
    <linearGradient id="obsidianBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161620" />
      <stop offset="100%" stop-color="#08080C" />
    </linearGradient>

    <!-- Glow Effect for Solar Core -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Card with Micro Solar Rim -->
  <rect width="64" height="64" rx="18" fill="url(#obsidianBg)" stroke="rgba(255, 210, 31, 0.45)" stroke-width="2" />

  <!-- AbeyCollab Nexus Mark: Interlocking "A" Synergy Arch -->
  <!-- 1. Creator Energy "A" Apex -->
  <path
    d="M17 48 L29.5 16 C30.6 13.2 33.4 13.2 34.5 16 L47 48"
    stroke="url(#abeySolarGold)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 2. Brand Dialogue & Collaboration Loop -->
  <path
    d="M22.5 37 C22.5 29.5 30.5 27.5 36 30.5 C41.5 33.5 43 40.5 38 43.5 C33 46.5 25.5 42.5 25.5 35 C25.5 29.5 33.5 27 41 31.5"
    stroke="url(#abeyBrandWhite)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 3. Escrow Deal Core Aperture -->
  <circle cx="32" cy="36.5" r="4.2" fill="url(#abeySolarGold)" filter="url(#goldGlow)" />
  <circle cx="32" cy="36.5" r="1.8" fill="#0A0A0E" />
</svg>
