<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="valenceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D00" />
      <stop offset="50%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FFA800" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Dark Tile -->
  <rect width="64" height="64" rx="16" fill="#0A0E1A" stroke="url(#valenceGrad)" stroke-width="2.5" />

  <!-- Outer Diamond Orbital Frame -->
  <path d="M32 6L56 32L32 58L8 32L32 6Z" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" stroke-linejoin="round" />

  <!-- Inner Angular Orbitals -->
  <circle cx="32" cy="32" r="16" stroke="rgba(255, 77, 0, 0.3)" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Sharp Geometric V Mark -->
  <path d="M18 20L32 46L46 20" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Core Atomic Energy Focal Dot -->
  <circle cx="32" cy="22" r="4.5" fill="url(#valenceGrad)" filter="url(#glow)" />
</svg>
